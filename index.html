/* Theme and text size before the first paint (no flash). The app repeats this in core.js. */
(function () {
  try {
    var s = JSON.parse(localStorage.getItem('astrosutras.basics.v1') || '{}'), r = document.documentElement;
    var dark = s.theme === 'dark' || (s.theme !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);

    var f = Math.round(+s.fs); if (f >= 13 && f <= 24) r.style.setProperty('--fs', f + 'px');

<style>
/* ASTROSUTRAS course app: engine CSS (theme tokens, layout, chrome). Blocks and charts: render.css. See docs/ENGINE-API.md section 7. */
:root { --bg:#f6f6fb; --card:#ffffff; --ink:#1f1f2e; --muted:#5f5f76; --accent:#2e2a6e; --onaccent:#ffffff; --saffron:#d9730d; --onsaffron:#1b1208; --gold:#9a4d07; --line:#e1e1ec; --tint:#eeedf8; --good:#237a4d; --bad:#c0392b; --focus:#b45309; --hdr:#2e2a6e; --onhdr:#ffffff; --shadow:0 1px 3px rgba(30,30,60,.12); --fs:16px; --hh:54px; color-scheme:light; }
:root[data-theme="dark"] { --bg:#14141c; --card:#1d1d29; --ink:#ececf5; --muted:#a4a4ba; --accent:#a9a7ff; --onaccent:#14141c; --saffron:#e8893a; --onsaffron:#1b1208; --gold:#f0a45a; --line:#34344a; --tint:#26263a; --good:#4cc38a; --bad:#ff7b6b; --focus:#f0a45a; --hdr:#23205a; --shadow:0 1px 3px rgba(0,0,0,.5); color-scheme:dark; }
* { box-sizing:border-box; }
html { font-size:var(--fs); -webkit-text-size-adjust:100%; scroll-padding-top:calc(var(--hh) + 14px); }
body { margin:0; font-family:system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; background:var(--bg); color:var(--ink); line-height:1.55; min-height:100vh; min-height:100dvh; overflow-wrap:break-word; }
img, svg { max-width:100%; }
a { color:var(--accent); }
button { font-family:inherit; }
:focus-visible { outline:3px solid var(--focus); outline-offset:2px; border-radius:4px; }
.app-hdr .ib:focus-visible, .app-hdr .app-brand:focus-visible, .app-hdr .app-pill:focus-visible, .hero :focus-visible { outline-color:#fff; }   /* the brown ring is only 2.5:1 on the indigo header and the hero gradient; white is 12:1 */
h1:focus, main:focus { outline:none; }
[hidden] { display:none !important; }
.app-skip { position:absolute; left:8px; top:-60px; z-index:100; background:var(--saffron); color:var(--onsaffron); padding:10px 14px; border-radius:8px; font-weight:700; }
.app-skip:focus { top:8px; }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

/* ----- header ----- */
.app-hdr { position:sticky; top:0; z-index:30; height:var(--hh); background:var(--hdr); color:var(--onhdr); display:flex; align-items:center; gap:6px; padding:0 max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left)); }
.app-brand { flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; color:var(--onhdr); text-decoration:none; line-height:1.15; padding:4px 2px; }
.app-brand .b1 { font-size:.62rem; letter-spacing:.18em; opacity:.8; font-weight:700; }
.app-brand .b2 { font-size:1.05rem; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ib { appearance:none; border:0; background:rgba(255,255,255,.14); color:var(--onhdr); min-width:42px; height:42px; border-radius:10px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; padding:0 8px; font-size:.9rem; font-weight:600; flex:none; }
.ib:hover { background:rgba(255,255,255,.26); }
.ib.txt { padding:0 12px; white-space:nowrap; }

.app-pill { background:var(--saffron); color:var(--onsaffron); border-radius:14px; padding:3px 11px; font-size:.82rem; font-weight:700; text-decoration:none; white-space:nowrap; flex:none; }
.app-langwrap { position:relative; flex:none; }
.app-menu { position:absolute; right:0; top:48px; min-width:170px; background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,.3); padding:4px; z-index:40; }
.app-menu button { display:block; width:100%; text-align:left; border:0; background:none; color:var(--ink); padding:10px 12px; border-radius:8px; font-size:1rem; cursor:pointer; }
.app-menu button:hover, .app-menu button[aria-checked="true"] { background:var(--tint); }
.app-readbar { position:fixed; left:0; right:0; top:var(--hh); height:3px; z-index:29; background:transparent; pointer-events:none; opacity:0; transition:opacity .2s; }

.app-readbar i { display:block; height:100%; width:0; background:var(--saffron); }

/* ----- layout: sidebar + view ----- */
.app-wrap { display:flex; align-items:flex-start; max-width:1400px; margin:0 auto; }
.app-side { width:300px; flex:none; position:sticky; top:var(--hh); height:calc(100vh - var(--hh)); height:calc(100dvh - var(--hh)); overflow-y:auto; background:var(--card); border-right:1px solid var(--line); padding:8px 0 24px; }
#main { flex:1; min-width:0; padding:18px 18px 40px; }
.app-view { max-width:56rem; margin:0 auto; }
.app-scrim { display:none; }
.app-loading, .app-empty { color:var(--muted); padding:30px 8px; text-align:center; }
@media (max-width:959px) {

  .app-side.open { transform:none; visibility:visible; transition:transform .2s; box-shadow:0 0 30px rgba(0,0,0,.45); }
  .app-scrim.open { display:block; position:fixed; inset:var(--hh) 0 0 0; background:rgba(0,0,0,.45); z-index:34; }

}
@media (max-width:420px) { .app-pill { display:none; } .app-brand .b1 { display:none; } #themeBtn { display:none; } }   /* the theme button is also in the reading toolbar and under More */
@media (min-width:960px) { #menuBtn { display:none; } }

/* ----- sidebar navigation ----- */
.nav-grp { padding:14px 16px 4px; font-size:.72rem; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); font-weight:800; }
.nav-it { display:flex; align-items:center; gap:8px; padding:9px 16px; color:var(--ink); text-decoration:none; border-left:4px solid transparent; font-size:.95rem; }
.nav-it:hover { background:var(--tint); }
.nav-it[aria-current="page"], .nav-it.cur { background:var(--tint); border-left-color:var(--saffron); font-weight:700; }
.nav-it .nm { flex:1; min-width:0; }
.nav-it .pc { color:var(--muted); font-size:.78rem; white-space:nowrap; }
.nav-it .tk { width:18px; text-align:center; color:var(--good); font-weight:800; flex:none; }
.nav-sub { margin:2px 0 6px; }
.nav-sub .nav-it { padding:6px 16px 6px 38px; font-size:.86rem; }
.nav-sub .nav-it .nm { line-height:1.3; }
.nav-sub .nav-it .dot { width:9px; height:9px; border-radius:50%; border:2px solid var(--muted); flex:none; }
.nav-sub .nav-it .dot.on { background:var(--good); border-color:var(--good); }

/* ----- generic components ----- */
.btn { appearance:none; display:inline-flex; align-items:center; justify-content:center; gap:6px; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:10px; padding:9px 14px; font-size:.95rem; font-weight:600; cursor:pointer; text-decoration:none; line-height:1.3; min-height:42px; text-align:center; }
.btn:hover { border-color:var(--accent); }
.btn svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }
.btn.primary { background:var(--accent); color:var(--onaccent); border-color:var(--accent); }
.btn.saffron { background:var(--saffron); color:var(--onsaffron); border-color:var(--saffron); }
.btn.danger { color:var(--bad); }
.btn.small { padding:5px 10px; min-height:34px; font-size:.88rem; }
.btn[aria-pressed="true"] { background:var(--tint); border-color:var(--saffron); color:var(--ink); }   /* also for .primary and .saffron: their own text colours are not readable on the tint */
.btn:disabled, .btn[aria-disabled="true"] { opacity:.45; cursor:default; pointer-events:none; }
.bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:12px 0; }
.bar .sp { flex:1; }
.seg { display:inline-flex; flex-wrap:wrap; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--card); }
.seg button { border:0; border-right:1px solid var(--line); background:var(--card); color:var(--ink); padding:9px 14px; font-size:.95rem; cursor:pointer; min-height:42px; }
.seg button:last-child { border-right:0; }
.seg button[aria-pressed="true"] { background:var(--accent); color:var(--onaccent); font-weight:700; }
.panel { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 20px; margin:0 0 16px; box-shadow:var(--shadow); }
.panel > h2:first-child, .panel > h3:first-child { margin-top:0; }
h1, h2, h3 { line-height:1.25; color:var(--accent); }
h1 { font-size:1.65rem; margin:.2em 0 .35em; }
h2 { font-size:1.3rem; margin:1.4em 0 .5em; }
h3 { font-size:1.08rem; margin:1.2em 0 .4em; }
.muted, .note { color:var(--muted); font-size:.9rem; }
.crumb { font-size:.85rem; color:var(--muted); margin:0 0 6px; }
.crumb a { color:var(--accent); }
.badge { display:inline-block; font-size:.72rem; font-weight:800; letter-spacing:.04em; text-transform:uppercase; padding:2px 9px; border-radius:11px; border:1px solid var(--line); background:var(--tint); color:var(--accent); white-space:nowrap; }
.badge.k-lesson, .badge.k-chapter { background:var(--accent); color:var(--onaccent); border-color:var(--accent); }

.badge.k-practical, .badge.k-workbook, .badge.k-case { border-color:var(--saffron); color:var(--gold); }

.prog i { display:block; height:100%; background:var(--saffron); border-radius:6px; min-width:0; }
.app-toast { position:fixed; left:50%; bottom:22px; transform:translate(-50%,20px); background:var(--ink); color:var(--bg); padding:9px 16px; border-radius:22px; font-size:.9rem; opacity:0; pointer-events:none; transition:.25s; z-index:60; max-width:90vw; text-align:center; }
.app-toast.on { opacity:1; transform:translate(-50%,0); }
.app-notice { border-left:5px solid var(--saffron); background:var(--tint); border-radius:8px; padding:10px 14px; margin:12px 0; font-size:.95rem; }
.app-notice.bad { border-left-color:var(--bad); }
.app-notice.good { border-left-color:var(--good); }
.app-notice strong { display:block; font-size:.78rem; letter-spacing:.07em; text-transform:uppercase; color:var(--gold); }
.app-notice.bad strong { color:var(--bad); }
mark.hit { background:#ffe08a; color:#1b1208; border-radius:3px; padding:0 1px; }
textarea.app-ta, input.app-in, select.app-in { width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 12px; background:var(--card); color:var(--ink); font-size:1rem; font-family:inherit; }
textarea.app-ta { min-height:110px; resize:vertical; line-height:1.5; }

/* ----- home ----- */
.hero { background:linear-gradient(135deg,var(--hdr),#4a2d7a); color:#fff; border-radius:16px; padding:24px 22px; margin-bottom:18px; box-shadow:var(--shadow); }
.hero .kick { font-size:.72rem; letter-spacing:.16em; font-weight:800; opacity:.85; text-transform:uppercase; }

.hero p { margin:.3em 0; opacity:.93; }
.hero .tag { font-style:italic; }
.hero .prog { background:rgba(255,255,255,.25); height:10px; }
.hero .btn { background:rgba(255,255,255,.16); color:#fff; border-color:rgba(255,255,255,.3); }
.hero .btn.saffron { background:var(--saffron); color:var(--onsaffron); border-color:var(--saffron); }
.team { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; }

.person { display:flex; align-items:center; gap:10px; margin:6px 0; }

.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px; margin:12px 0; }
.card { display:block; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:13px 15px; color:var(--ink); text-decoration:none; box-shadow:var(--shadow); position:relative; }

.card .kc { font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; font-weight:800; color:var(--gold); }
.card h3 { margin:.15em 0 .3em; font-size:1rem; color:var(--accent); }
.card .meta { font-size:.82rem; color:var(--muted); display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; }
.card.done { border-left:5px solid var(--good); }
.card .tick { position:absolute; right:12px; top:10px; color:var(--good); font-weight:800; }
.plist { list-style:none; margin:10px 0; padding:0; }
.plist li { margin:6px 0; }
.plist a { display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; text-decoration:none; color:var(--ink); }
.plist a:hover { border-color:var(--accent); }
.plist .n { width:30px; height:30px; border-radius:50%; background:var(--tint); color:var(--accent); display:flex; align-items:center; justify-content:center; font-size:.8rem; font-weight:800; flex:none; }
.plist .done .n { background:var(--good); color:var(--onaccent); }   /* white on the light green of the dark theme was 2.2:1 */
.plist .t { flex:1; min-width:0; }
.plist .t small { display:block; color:var(--muted); font-size:.78rem; }
.plist .mk { color:var(--gold); }

/* ----- reading view ----- */
.page { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px 24px; box-shadow:var(--shadow); }
.page .ptop { display:flex; flex-wrap:wrap; gap:8px; align-items:center; font-size:.85rem; color:var(--muted); }
.page h1 { margin-top:.3em; }
.tools { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 4px; padding:8px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); align-items:center; }
.tools .sp { flex:1; }
.toc { margin:10px 0; border:1px solid var(--line); border-radius:10px; background:var(--bg); }
.toc summary { padding:9px 14px; cursor:pointer; font-weight:700; color:var(--accent); }
.toc ol { margin:0; padding:0 14px 10px 36px; font-size:.92rem; }
.toc li.l3 { margin-left:16px; list-style:circle; }
.toc a { text-decoration:none; }
.rbody { max-width:46rem; margin:14px auto 0; line-height:1.6; color:var(--ink); }
.pnav { display:flex; flex-wrap:wrap; gap:10px; margin:26px 0 8px; padding-top:16px; border-top:1px solid var(--line); }
.pnav .btn { flex:1 1 200px; }
.pnav .btn small { display:block; font-weight:400; font-size:.76rem; color:inherit; opacity:.85; }
.notes { margin:16px 0 0; border:1px solid var(--line); border-radius:10px; background:var(--bg); }

.notes > div { padding:0 14px 14px; }
.donechip { color:var(--good); font-weight:800; }

/* ----- search ----- */
.res { display:block; background:var(--card); border:1px solid var(--line); border-left:5px solid var(--saffron); border-radius:10px; padding:10px 14px; margin:9px 0; text-decoration:none; color:var(--ink); }
.res:hover { border-color:var(--accent); border-left-color:var(--saffron); }
.res b.t { color:var(--accent); }
.res .where { font-size:.78rem; color:var(--muted); margin:2px 0; }
.res .snip { font-size:.9rem; color:var(--ink); }

/* ----- flashcards ----- */
.fc { max-width:560px; margin:14px auto; background:var(--card); border:2px solid var(--accent); border-radius:18px; padding:26px 22px; min-height:230px; text-align:center; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; box-shadow:var(--shadow); }
.fc .term { font-size:1.7rem; font-weight:800; color:var(--accent); line-height:1.2; }
.fc .en { font-size:1.08rem; font-weight:700; color:var(--gold); }
.fc .def { font-size:1rem; text-align:left; }
.fc .where { font-size:.82rem; color:var(--muted); }
.fc .chips a { display:inline-block; margin:2px; padding:2px 10px; border-radius:12px; background:var(--tint); font-size:.82rem; text-decoration:none; }

.fcbar { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:8px 0; }

.set h2:first-child { border-top:0; margin-top:.2em; padding-top:0; }
.dlprog { height:12px; border-radius:8px; background:var(--line); overflow:hidden; margin:8px 0; }
.dlprog i { display:block; height:100%; width:0; background:var(--saffron); transition:width .15s; }
kbd { background:var(--tint); border:1px solid var(--line); border-radius:4px; padding:0 5px; font-size:.85em; }

/* ----- Devanagari and other scripts: set by the engine through <html lang> ----- */
html[lang="hi"] body, html[lang="hi"] button, html[lang="hi"] input, html[lang="hi"] textarea, html[lang="hi"] select { font-family:"Noto Sans Devanagari","Nirmala UI","Mangal",system-ui,"Segoe UI",Roboto,sans-serif; }

html[lang="hi"] .btn, html[lang="hi"] .seg button { white-space:normal; }

@media (max-width:600px) {
  .page { padding:15px 14px; border-radius:12px; }

  .page { border:0; box-shadow:none; padding:0; }
  #main { padding:0; }
}
@media (prefers-reduced-motion:reduce) { * { transition:none !important; scroll-behavior:auto !important; } }

/* render.css: the blocks of a page and the charts. Written by app-render; read ENGINE-API.md section 7 first.
   Everything is scoped under .rbody, classes are prefixed r-, sizes are em/rem (the A- and A+ buttons change html font-size), colours come from the
   engine tokens (--card --ink --muted --accent --onaccent --saffron --onsaffron --gold --line --tint --good --bad) and follow html[data-theme="dark"]. */

/* ---------- text ---------- */
.rbody [id] { scroll-margin-top: 4.5rem; }
.rbody > :first-child { margin-top: 0; }
.rbody p { margin: .75em 0; }
.rbody .r-h { color: var(--accent); line-height: 1.25; font-weight: 700; }
/* the look follows the level in the data (class r-h2 / r-h3 / r-h4); the tag may be one level higher when the data skips a level (see heading() in render.js) */
.rbody .r-h2 { font-size: 1.4em; margin: 1.9em 0 .55em; padding-bottom: .25em; border-bottom: .13em solid var(--saffron); }
.rbody .r-h3 { font-size: 1.15em; margin: 1.6em 0 .4em; color: var(--gold); }
.rbody .r-h4 { font-size: .88em; margin: 1.4em 0 .3em; color: var(--ink); text-transform: uppercase; letter-spacing: .07em; }
.rbody .r-h:focus { outline: none; }
.rbody ul, .rbody ol { margin: .65em 0; padding-left: 1.45em; }
.rbody li { margin: .32em 0; }

function flAct(a) {

}

    const c = await caches.open(ks[ks.length - 1]), have = new Set((await c.keys()).map(r => new URL(r.url).pathname + new URL(r.url).search));
    const urls = await offlineUrls(), base = new URL('.', location.href).pathname;
    const n = urls.filter(u => have.has(new URL(u, location.href).pathname + new URL(u, location.href).search)).length;
    if ($('offStat')) $('offStat').textContent = n >= urls.length ? t('Offline copy: complete. The whole course works without internet.') : t('Offline copy: {n} of {total} files saved on this device.', { n, total: urls.length });
  } catch (x) { /* status is optional */ }
}
async function downloadAll() {
  const btn = $('dlBtn'), st = $('dlStat'), pg = $('dlProg'), fill = $('dlFill');
  if (!location.protocol.startsWith('http')) { st.textContent = t('This copy runs from a file, so everything is already on this computer.'); return; }
  const reg = await swReady();
  if (!reg) { st.textContent = t('The offline helper is not ready yet. Reload the page once and try again.'); return; }
  btn.disabled = true; pg.hidden = false; fill.style.width = '2%'; st.textContent = t('Preparing the list of files...');
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* optional */ }
  const urls = await offlineUrls(), ch = new MessageChannel();
  ch.port1.onmessage = ev => {
    const d = ev.data || {}; if (!$('dlStat')) return;
    if (d.type === 'progress') { $('dlFill').style.width = Math.max(2, Math.round(100 * d.done / d.total)) + '%'; $('dlStat').textContent = t('Saving file {done} of {total}...', { done: d.done, total: d.total }); }
    if (d.type === 'done') { $('dlFill').style.width = '100%'; $('dlBtn').disabled = false; $('dlStat').textContent = d.failed ? t('Finished, but {n} files could not be saved. Check the connection and try again.', { n: d.failed }) : t('Done. The whole course now works without internet.'); refreshOffline(); }
  };
  reg.active.postMessage({ type: 'precache', urls }, [ch.port2]);
}
function exportBackup() {
  flush();
  const data = { app: 'astrosutras-basics', v: 1, exported: new Date().toISOString(), state: S };
  const a = document.createElement('a'), url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
  const dn = new Date(), p2 = n => (n < 10 ? '0' : '') + n;   // the reader's local date, not UTC
  a.href = url; a.download = 'astrosutras-basics-progress-' + dn.getFullYear() + '-' + p2(dn.getMonth() + 1) + '-' + p2(dn.getDate()) + '.json'; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000); toast(t('Backup file saved'));
}
function importBackup(file) {
  file.text().then(tx => {
    const d = parseJson(tx), st = d && isObj(d.state) ? d.state : d;
    if (isObj(d) && typeof d.app === 'string' && d.app !== 'astrosutras-basics') { alert(t('That file is not a valid backup of this course.')); return; }   // a backup of another course would erase this progress
    if (!isObj(st) || !(isObj(st.done) || isObj(st.marks) || isObj(st.notes) || isObj(st.ans) || isObj(st.ck))) { alert(t('That file is not a valid backup of this course.')); return; }
    if (!confirm(t('This replaces the progress, notes and answers on this device with the backup. Continue?'))) return;
    const keep = { lang: S.lang, theme: S.theme, fs: S.fs }, n = normState(st); n.lang = keep.lang; n.theme = keep.theme; n.fs = keep.fs;
    S = n; save(); flush(); applyTheme(); updateHeader(); toast(t('Backup restored')); go('#/');
  }).catch(() => alert(t('That file could not be read.')));
}

// ---------- router ----------
function parseRoute() {
  const raw = (location.hash || '#/').replace(/^#\/?/, ''), seg = raw.split('/');
  const dec = s => { try { return decodeURIComponent(s); } catch (e) { return s; } };
  switch (seg[0]) {
    case '': return { name: 'home' };
    case 'module': return { name: 'module', n: +seg[1] || 0 };
    case 'part': return { name: 'part', id: dec(seg[1] || '') };
    case 'page': return { name: 'page', slug: dec(seg[1] || ''), anchor: dec(seg[2] || '') };
    case 'search': return { name: 'search', q: dec(seg.slice(1).join('/')) };
    case 'flash': return { name: 'flash' };
    case 'bookmarks': return { name: 'bookmarks' };
    case 'more': return { name: 'more' };
    default: return { name: 'unknown' };
  }
}
async function route(opt) {
  opt = opt || {}; const my = ++RT;
  if (!C) return;
  beforeLeave();
  const r = parseRoute(); ROUTE = r; CUR = null; $('readbar').classList.remove('on');
  let v;
  try {
    switch (r.name) {
      case 'home': v = homeView(); break;
      case 'module': v = moduleView(r.n); break;
      case 'part': v = partView(r.id); break;
      case 'page': v = await pageView(r, my); break;
      case 'search': v = searchView(r.q); break;
      case 'flash': v = await flashView(); break;
      case 'bookmarks': v = bookmarksView(); break;
      case 'more': v = moreView(); break;
      default: v = notFound();
    }
  } catch (e) { console.error(e); v = errorView(e); }
  if (my !== RT || !v) return;
  const view = $('view'), sy = window.scrollY;
  view.innerHTML = v.html;
  document.title = v.title ? v.title + ' | ' + (C.course.short || C.course.title) : (C.course.title);
  closeMenus(); drawNav(); updateHeader();
  if (v.after) { try { v.after(); } catch (e) { console.error(e); } }
  if (!v.kindPage || !(r.anchor)) { if (opt.keep) window.scrollTo(0, sy); else if (!v.noScrollTop && !(v.kindPage && r.anchor)) window.scrollTo(0, 0); }
  if (v.kindPage) { $('readbar').classList.add('on'); updateReadbar(); }
  const h1 = view.querySelector('h1');
  if (!FIRST && !opt.keep && h1 && !(r.name === 'page' && r.anchor)) { h1.focus({ preventScroll: true }); }
  FIRST = false;
}
function onExternalState() { if (!C) return; drawNav(); updateHeader(); }

// ---------- reading progress bar ----------
let rafBusy = false, lastSave = 0;
function updateReadbar() {
  if (ROUTE.name !== 'page') return;
  const mx = document.documentElement.scrollHeight - window.innerHeight, p = mx > 0 ? Math.min(1, Math.max(0, window.scrollY / mx)) : 1;
  $('readfill').style.width = (p * 100).toFixed(1) + '%'; curPct = Math.round(p * 100);
  if (S.last && S.last.slug === ROUTE.slug && Date.now() - lastSave > 2500) { lastSave = Date.now(); S.last.p = curPct; save(); }
}
window.addEventListener('scroll', () => { if (rafBusy) return; rafBusy = true; requestAnimationFrame(() => { rafBusy = false; updateReadbar(); }); }, { passive: true });

// ---------- events ----------
function setTheme(v) { S.theme = v; save(); applyTheme(); updateHeader(); if (ROUTE.name === 'more') $('view').querySelectorAll('[data-act="themeset"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === v))); const b2 = $('thBtn2'); if (b2) { const th = effTheme(); b2.innerHTML = ic(th === 'dark' ? 'sun' : 'moon'); b2.setAttribute('aria-label', th === 'dark' ? t('Switch to light mode') : t('Switch to dark mode')); } }
function setFs(d) { S.fs = Math.max(13, Math.min(24, S.fs + d)); save(); applyTheme(); const e = $('fsNow'); if (e) e.textContent = t('Text size {n}px', { n: S.fs }); toast(t('Text size {n}px', { n: S.fs })); }
async function switchLang(l) {
  if (!LANG_LIST.includes(l) || l === LANG) { closeMenus(); return; }
  const old = LANG; closeMenus(); flush();
  try { await activateLang(l); S.lang = l; save(); flush(); } catch (e) { console.error(e); try { await activateLang(old); } catch (x) { /* keep */ } toast(t('That language could not be loaded.')); return; }
  FL.cards = []; FL.lang = '';
  shellText(); await route({ keep: true });
}
document.addEventListener('click', e => {
  const a = e.target.closest && e.target.closest('a[href]');
  if (a) {
    const href = a.getAttribute('href') || '';
    if (a.id === 'skipLink') { e.preventDefault(); $('main').focus({ preventScroll: false }); return; }   // a plain #main link would change the route
    if (a.dataset.q) HLQ = a.dataset.q;
    if (a.dataset.resume) RESUME = a.dataset.resume;
    if (href === location.hash && href.indexOf('#/page/') === 0) { e.preventDefault(); route({ keep: true }); }   // same link again: scroll to the anchor again
    else if (href.indexOf('#/') === 0 || href === '#') closeMenus();
  }
  const tg = e.target.closest && e.target.closest('[data-act]'); if (!tg) { if (!e.target.closest('#langWrap')) { $('langMenu').hidden = true; } return; }
  const act = tg.dataset.act, d = tg.dataset;
  switch (act) {
    case 'fs': setFs(+d.d); break;
    case 'theme': setTheme(effTheme() === 'dark' ? 'light' : 'dark'); break;
    case 'themeset': setTheme(d.v); break;
    case 'bm': {
      if (!CUR) break; const s = CUR.slug; if (S.marks[s]) delete S.marks[s]; else S.marks[s] = Date.now(); save();
      const on = !!S.marks[s]; tg.setAttribute('aria-pressed', String(on)); tg.innerHTML = (on ? icFill('star') : ic('star')) + '<span>' + esc(on ? t('Bookmarked') : t('Bookmark')) + '</span>'; toast(on ? t('Bookmark added') : t('Bookmark removed')); break;
    }
    case 'done': {
      if (!CUR) break; const s = CUR.slug, m = C.by[s]; let on;
      if (S.done[s]) { delete S.done[s]; on = false; } else { S.done[s] = Date.now(); on = true; } save();
      tg.setAttribute('aria-pressed', String(on)); tg.textContent = on ? '✓ ' + t('Completed. Tap to undo') : t('Mark complete');
      const chip = $('doneChip'); if (chip) chip.hidden = !on;
      const nx = document.querySelector('.pnav [rel="next"]'); if (nx) nx.classList.toggle('primary', on);
      drawNav(); updateHeader(); toast(on ? t('Marked complete') : t('Marked as not complete'));
      if (on && ov100()) toast(t('Course complete. Well done!')); break;   // also on the very last page (it has no next page)
    }
    case 'lang': switchLang(d.l); break;
    case 'install': if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt.userChoice.then(() => { deferredPrompt = null; const b = $('installBtn'); if (b) b.hidden = true; }); } break;
    case 'dlall': downloadAll(); break;
    case 'export': exportBackup(); break;
    case 'import': $('importFile').click(); break;
    case 'reset': if (confirm(t('This erases your progress, notes, bookmarks and written answers on this device. Continue?'))) { const keep = { lang: S.lang, theme: S.theme, fs: S.fs }; S = normState(keep); save(); flush(); applyTheme(); updateHeader(); toast(t('Progress reset')); go('#/'); } break;
    case 'retry': route({ keep: true }); break;
    case 'moreres': SQ.shown += 30; drawResults(); break;
    case 'flflip': case 'flnext': case 'flprev': case 'flgot': case 'flagain': case 'flrestart': case 'flshuf': flAct(act); break;
  }
});
const ov100 = () => overall().pct === 100;
document.addEventListener('change', e => {
  const tg = e.target;
  if (tg.matches && tg.matches('input[data-ck]') && CUR && CUR.ctx) CUR.ctx.setCheck(tg.getAttribute('data-ck'), tg.checked);
  else if (tg.id === 'flScope') { flBuild(tg.value); flDraw(); }
});
document.addEventListener('input', e => {
  const tg = e.target;
  if (tg.matches && tg.matches('textarea[data-ans]') && CUR && CUR.ctx) CUR.ctx.setAnswer(tg.getAttribute('data-ans'), tg.value);
  else if (tg.matches && tg.matches('textarea[data-note]') && CUR) { const v = tg.value.slice(0, MAX_TEXT); if (v.trim()) S.notes[CUR.slug] = v; else delete S.notes[CUR.slug]; save(); }
  else if (tg.id === 'sq') { clearTimeout(sTimer); sTimer = setTimeout(() => { SQ.q = tg.value; doSearch(tg.value); }, 220); }
});
document.addEventListener('focusout', e => { if (e.target.matches && e.target.matches('textarea[data-ans], textarea[data-note]')) flush(); });
document.addEventListener('submit', e => { if (e.target.id === 'sform') { e.preventDefault(); clearTimeout(sTimer); SQ.q = $('sq').value; doSearch(SQ.q); } });
const drawerOpen = () => $('side').classList.contains('open') && getComputedStyle($('scrim')).display !== 'none';   // the phone drawer, which covers the page like a dialog
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    const drawer = drawerOpen(), menu = !$('langMenu').hidden;
    closeMenus();
    if (drawer) $('menuBtn').focus(); else if (menu) $('langBtn').focus();   // keep the keyboard user's place instead of dropping focus to the page start
    return;
  }
  if (e.key === 'Tab' && drawerOpen()) {   // keep Tab inside the open drawer: it must not walk into the page behind it
    const items = Array.from($('side').querySelectorAll('a[href]')), act = document.activeElement;
    if (items.length) {
      if (e.shiftKey && act === items[0]) { e.preventDefault(); items[items.length - 1].focus(); }
      else if (!e.shiftKey && act === items[items.length - 1]) { e.preventDefault(); items[0].focus(); }
    }
  }
  const tg = e.target;
  if (ROUTE.name === 'flash' && FL.deck.length && (tg === document.body || tg.id === 'main' || tg.tagName === 'H1')) {
    if (e.key === ' ') { e.preventDefault(); flAct('flflip'); } else if (e.key === 'ArrowRight') flAct('flnext'); else if (e.key === 'ArrowLeft') flAct('flprev');
  }
});
$('menuBtn').addEventListener('click', () => openNav(!$('side').classList.contains('open')));
$('scrim').addEventListener('click', () => { openNav(false); $('menuBtn').focus(); });
$('srchBtn').addEventListener('click', () => go('#/search'));
$('moreBtn').addEventListener('click', () => go('#/more'));
$('themeBtn').addEventListener('click', () => setTheme(effTheme() === 'dark' ? 'light' : 'dark'));
$('langBtn').addEventListener('click', e => {
  e.stopPropagation();
  if (LANG_LIST.length === 2) { switchLang(LANG_LIST.find(l => l !== LANG)); return; }
  const m = $('langMenu'); m.hidden = !m.hidden; $('langBtn').setAttribute('aria-expanded', String(!m.hidden)); if (!m.hidden) { const f = m.querySelector('[aria-checked="true"]') || m.querySelector('button'); if (f) f.focus(); }
});
$('importFile').addEventListener('change', e => { const f = e.target.files[0]; if (f) importBackup(f); e.target.value = ''; });
window.addEventListener('hashchange', () => route());
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; const b = $('installBtn'); if (b) b.hidden = false; });
window.addEventListener('appinstalled', () => { deferredPrompt = null; toast(t('The app is installed')); });
window.addEventListener('beforeprint', () => document.querySelectorAll('details').forEach(d => { d.open = true; }));
window.addEventListener('online', () => { const e = $('offStat'); if (e) refreshOffline(); });

// ---------- boot ----------
async function boot() {
  readLangs(); applyTheme();
  const lang = pickLang();
  try { await activateLang(lang); }
  catch (e) {
    console.error(e);
    $('view').innerHTML = '<div class="page"><h1>' + esc(t('The course could not be loaded')) + '</h1><p>' + esc(t('The course data files (folder "data") are missing or could not be read. Connect to the internet once and reload, or reinstall the app.')) + '</p><p class="note">' + esc(e.message || String(e)) + '</p><div class="bar"><button class="btn primary" type="button" onclick="location.reload()">' + esc(t('Try again')) + '</button></div></div>';
    return;
  }
  shellText();
  await route();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => { /* offline copy is optional */ });
}
boot();
